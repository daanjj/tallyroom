<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F5F3FA; --surface:#FFFFFF; --surface-2:#EDE9F6; --ink:#1E1838; --ink-2:#584F73; --muted:#8B849E;
  --line:#E2DDEE; --line-2:#CFC8E2; --accent:#5A3BD6; --accent-ink:#FFFFFF; --accent-soft:#EAE4FB;
  --good:#1F7A4D; --good-soft:#DFF3E7; --warn:#9A5B00; --warn-soft:#FBEBD0;
  --shadow:0 1px 2px rgba(30,24,56,.06),0 8px 24px -12px rgba(30,24,56,.18);
  --r1:#E6DEFB; --r2:#D2C5F7; --r3:#BBA9F2; --r4:#A28CEB; --r5:#8A6FE3; --r6:#7256DB; --r7:#5C3FD1; --r8:#4A30B4; --r9:#3B2594; --r10:#2C1B72;
  --display:'Manrope',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14111F; --surface:#1E192E; --surface-2:#282240; --ink:#F0ECF9; --ink-2:#B8B0CF; --muted:#7E7699;
  --line:#2E2745; --line-2:#3E3660; --accent:#A48EF3; --accent-ink:#17122A; --accent-soft:#2A2247;
  --good:#5ED39A; --good-soft:#173A2A; --warn:#F2B860; --warn-soft:#3A2A10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7);
  --r1:#3A2F66; --r2:#493B80; --r3:#59489A; --r4:#6A57B3; --r5:#7C69C9; --r6:#8F7CDB; --r7:#A391E8; --r8:#B8A8F2; --r9:#CCC0F8; --r10:#E0D8FC;
}}
:root[data-theme="dark"]{
  --bg:#14111F; --surface:#1E192E; --surface-2:#282240; --ink:#F0ECF9; --ink-2:#B8B0CF; --muted:#7E7699;
  --line:#2E2745; --line-2:#3E3660; --accent:#A48EF3; --accent-ink:#17122A; --accent-soft:#2A2247;
  --good:#5ED39A; --good-soft:#173A2A; --warn:#F2B860; --warn-soft:#3A2A10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7);
  --r1:#3A2F66; --r2:#493B80; --r3:#59489A; --r4:#6A57B3; --r5:#7C69C9; --r6:#8F7CDB; --r7:#A391E8; --r8:#B8A8F2; --r9:#CCC0F8; --r10:#E0D8FC;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--r4),var(--r9));display:grid;place-items:center}
.brand .mark i{display:block;width:4px;height:12px;background:var(--surface);border-radius:2px;box-shadow:-7px 3px 0 0 var(--surface),7px -3px 0 0 var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:14px;font-weight:600;font-family:var(--display)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.live .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.warn .dot{background:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:700;font-size:15px;line-height:1;transition:transform .08s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:#B4232C;border-color:transparent;background:transparent}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stage{display:grid;gap:16px}
@media (min-width:900px){.stage.two{grid-template-columns:1fr 300px}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.meta{color:var(--muted);font-size:14px}
.qnum{font-family:var(--display);font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:clamp(22px,3.2vw,34px);font-weight:700;letter-spacing:-.015em;margin-top:6px}
.hidden-note{display:flex;align-items:center;gap:12px;padding:28px;border:1px dashed var(--line-2);border-radius:14px;color:var(--ink-2);background:var(--surface-2)}
.progress{display:flex;align-items:center;gap:12px}
.progress .bar{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.progress b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15px}

/* chart */
.chart{padding:22px 22px 18px}
.chart-head{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.hero{display:flex;align-items:baseline;gap:6px}
.hero .num{font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hero .den{font-family:var(--display);font-weight:600;font-size:20px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.cols{display:grid;gap:8px;align-items:end;min-height:180px;position:relative;padding-top:24px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;position:relative;min-height:170px}
.col .count{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:18px}
.col .count small{color:var(--muted);font-weight:600}
.dots{display:flex;flex-direction:column-reverse;gap:4px;align-items:center;width:100%}
.dot-v{width:var(--d,22px);height:var(--d,22px);border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--surface);animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*40ms)}
.bar-v{width:min(100%,64px);border-radius:6px 6px 2px 2px;background:var(--c);transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) both;min-height:3px}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.dot-v,.bar-v,.mean-mark,.progress .bar i,.strip i{animation:none!important;transition:none!important}}
.axis{display:grid;gap:8px;margin-top:8px;border-top:2px solid var(--line-2);padding-top:8px;position:relative}
.axis .tick{text-align:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.axis .tick.hot{color:var(--ink)}
.rail{position:relative;height:26px;margin-top:10px}.mean-mark.flip::after{left:auto;right:calc(100% + 8px)}
.rail::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.mean-mark{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;z-index:1;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent);transition:left .5s cubic-bezier(.2,.8,.2,1)}
.mean-mark::after{content:attr(data-label);position:absolute;top:50%;left:calc(100% + 8px);transform:translateY(-50%);white-space:nowrap;background:var(--surface);padding:0 4px;font-family:var(--display);font-weight:800;font-size:12px;color:var(--accent);letter-spacing:.04em}
.ends{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:14px;color:var(--muted);font-style:italic}
.strip{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin-top:18px;background:var(--surface-2)}
.strip i{display:block;height:100%;background:var(--c);transition:flex-grow .5s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-style:italic}

/* summary */
.sum-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,220px) 64px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sum-row:first-of-type{border-top:0}
.sum-row .t{font-weight:600;font-size:16px}
.sum-row .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.sum-row .mini{display:flex;height:12px;gap:2px;border-radius:999px;overflow:hidden;background:var(--surface-2);position:relative}
.sum-row .mini i{display:block;height:100%;background:var(--c)}
.sum-row .m{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.sum-row .m small{font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:560px){.sum-row{grid-template-columns:1fr 56px}.sum-row .mini{grid-column:1/-1}}

/* side */
.side{padding:18px;align-self:start;display:flex;flex-direction:column;gap:14px}
.qr{display:grid;place-items:center;padding:10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;max-width:100%}
.link{font-size:13px;word-break:break-all;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-radius:8px;user-select:all}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people i{width:12px;height:12px;border-radius:50%;background:var(--line-2);display:inline-block;transition:background .3s}
.people i.on{background:var(--good)}
.people i.done{background:var(--accent)}

/* participant */
.p-wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.p-q{padding:22px}
.p-q .qtext{font-size:clamp(20px,5.5vw,26px)}
.scale{display:grid;gap:8px;margin-top:18px}
.scale button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink-2);transition:transform .1s,border-color .15s,background .15s}
.scale button:hover{border-color:var(--accent)}
.scale button.on{background:var(--c);border-color:var(--c);color:var(--sel-ink);transform:scale(1.04)}
.scale.opts button{aspect-ratio:auto;text-align:left;padding:12px 14px;display:flex;gap:12px;align-items:center;font-family:var(--body);font-weight:600;font-size:16px;line-height:1.3;color:var(--ink)}
.scale.opts button b{font-family:var(--display);font-weight:800;font-size:14px;min-width:24px;color:var(--muted)}
.scale.opts button.on b{color:inherit;opacity:.8}
.axis .tick.lab{font-size:12px;line-height:1.2;font-weight:600;padding:0 2px;overflow-wrap:anywhere}
.axis .tick.lab b{display:block;font-size:14px;font-weight:800}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;gap:12px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--good-soft);color:var(--good);font-weight:600;font-size:15px}
.toast.wait{background:var(--surface-2);color:var(--ink-2)}
.big-wait{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}50%{box-shadow:0 0 0 14px transparent}}

/* config modal */
.modal{position:fixed;inset:0;background:rgba(20,17,31,.55);display:grid;place-items:center;padding:16px;z-index:50;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal .card{width:min(820px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=url],textarea,select{padding:9px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);width:100%}
textarea{resize:vertical;min-height:60px}
.qcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.qcard .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.qcard .head{display:flex;align-items:center;gap:8px}
.qcard .head .qnum{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.seg button{padding:8px 14px;border:0;background:var(--surface);font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
</style>

</head>

const FIREBASE_CONFIG = {

  messagingSenderId: "107998744016",

const POLL_ID = "workshop-1";

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";
/* ============ defaults ============ */
const DEFAULT_CONFIG = {
  title: "Domein Cloud Mission Critical poll",
  mode: "live",            // "live" = one question at a time, "batch" = answer all first, reveal one by one
  joinUrl: "",
  questions: [
    q("Our strategy is clear enough that I could explain it to a new colleague in two minutes.",1,5,"Strongly disagree","Strongly agree"),
    q("I know which three priorities matter most this quarter.",1,5,"Strongly disagree","Strongly agree"),
    q("My day-to-day work visibly contributes to those priorities.",1,5,"Strongly disagree","Strongly agree"),
    q("Decisions in our team are made at the right level, without unnecessary escalation.",1,5,"Strongly disagree","Strongly agree"),
    q("When we agree on an action, it actually gets done.",1,5,"Never","Always"),
    q("We regularly review progress and adjust course when needed.",1,5,"Never","Always"),
    q("How confident are you that we will reach our goals this year?",1,10,"Not at all","Completely"),
    q("How much energy does the current way of working give you?",1,5,"Drains me","Energises me")
  ]
};
function normOptions(x){ if(!x) return []; if(typeof x==="string") x=x.split(/\r?\n/); if(!Array.isArray(x)) x=Object.values(x); return x.map(o=>String((o&&typeof o==="object")?(o.label??o.text??""):o??"").trim()).filter(Boolean).slice(0,11); }
function q(text,min,max,lo,hi,options){ const id="q"+Math.random().toString(36).slice(2,8); const o=normOptions(options);
  if(o.length>=2) return {id, text, kind:"options", options:o, min:1, max:o.length, lo:"", hi:""};
  return {id, text, min, max, lo, hi}; }
const isOpt = qu => qu && qu.kind==="options" && Array.isArray(qu.options) && qu.options.length>=2;
const optLabel = (qu,v) => isOpt(qu) ? (qu.options[v-1] ?? String(v)) : String(v);
function exportQ(qu){ return isOpt(qu) ? {text:qu.text, options:[...qu.options]} : {text:qu.text,min:qu.min,max:qu.max,lo:qu.lo,hi:qu.hi}; }
const DEFAULT_SESSION = { phase:"lobby", current:0, revealed:[], round:1, showLive:false, resetAt:0 };

/* ============ state ============ */
const S = { cfg:null, ses:null, votes:{}, me:{id:null,isHost:false,canWrite:true,ackReset:null}, ui:{view:null,configOpen:false,draft:null,readonly:false}, backend:null };
const app = document.getElementById("app");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============ helpers ============ */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function localId(){ try{ let id=localStorage.getItem("tr_pid"); if(!id){ id="p_"+Math.random().toString(36).slice(2,12); localStorage.setItem("tr_pid",id);} return id; }catch(e){ return "p_"+Math.random().toString(36).slice(2,12); } }
function rampColor(idx,n){ // idx 0..n-1 -> --r1..--r10 spread evenly
  if(n<=1) return "var(--r6)";
  const step = 1 + Math.round(idx*(9/(n-1)));
  return `var(--r${clamp(step,1,10)})`;
}
function selInk(idx,n){ const step=1+Math.round(idx*(9/(n-1||1))); return step>=5 ? "var(--surface)" : "var(--ink)"; }
function fmt(x,d=1){ return Number.isFinite(x)? x.toFixed(d).replace(/\.0$/,"") : "–"; }
const PRESENCE_MS = 150000; // a participant without answers counts as present for 2.5 min after their last heartbeat
function hasAnswers(v){ return !!(v && v.answers && Object.keys(v.answers).length); }
function isKicked(){ return S.me.ackReset!=null && !!S.ses && (S.ses.resetAt||0) > S.me.ackReset; }
function noteReset(s){ if(S.me.ackReset==null && s && s.phase) S.me.ackReset = s.resetAt||0; }
function currentRoundVotes(){ const r=S.ses?.round??1; const now=Date.now(); const out={};
  for(const [pid,v] of Object.entries(S.votes)){ if(!v || v.round!==r) continue;
    if(!hasAnswers(v)){ if(pid===S.me.id && S.me.isHost) continue; if(!v.t || now-v.t>PRESENCE_MS) continue; }
    out[pid]=v; }
  return out; }
function answersFor(qid){ return Object.values(currentRoundVotes()).map(v=>v.answers?.[qid]).filter(x=>Number.isFinite(x)); }
function joinedCount(){ return Object.keys(currentRoundVotes()).length; }
function stats(vals,min,max){
  const n=vals.length; if(!n) return {n:0};
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const sorted=[...vals].sort((a,b)=>a-b);
  const median = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/n);
  const counts={}; for(let v=min;v<=max;v++) counts[v]=0; vals.forEach(v=>{ if(counts[v]!=null) counts[v]++; });
  let mode=min, best=-1; for(let v=min;v<=max;v++){ if(counts[v]>best){best=counts[v];mode=v;} }
  return {n,mean,median,sd,counts,mode};
}

/* ============ chart ============ */
function chartHTML(qu, vals, opts={}){
  const n=vals.length, pts=qu.max-qu.min+1, st=stats(vals,qu.min,qu.max);
  const useBars = n>40;
  const maxCount = n? Math.max(...Object.values(st.counts)) : 0;
  const cols = []; const ticks=[]; const strip=[]; const legend=[];
  for(let v=qu.min, i=0; v<=qu.max; v++, i++){
    const c = st.counts?.[v]||0; const color=rampColor(i,pts);
    let marks="";
    if(useBars){ const h=maxCount? Math.round(140*c/maxCount) : 0; marks=`<div class="bar-v" style="--c:${color};height:${h}px"></div>`; }
    else { const d = pts>7 ? 16 : (n>16 ? 16 : 22); for(let k=0;k<c;k++) marks+=`<span class="dot-v" style="--c:${color};--d:${d}px;--i:${k}"></span>`; marks=`<div class="dots">${marks}</div>`; }
    const pct = n? Math.round(100*c/n) : 0;
    cols.push(`<div class="col">${c?`<div class="count">${c}<small> · ${pct}%</small></div>`:`<div class="count"></div>`}${marks}</div>`);
    ticks.push(isOpt(qu) ? `<div class="tick lab ${c?"hot":""}"><b>${v}</b>${esc(qu.options[i])}</div>` : `<div class="tick ${c?"hot":""}">${v}</div>`);
    if(c) strip.push(`<i style="--c:${color};flex-grow:${c}" title="${esc(optLabel(qu,v))}: ${c}"></i>`);
    legend.push(`<span><i style="--c:${color}"></i>${esc(optLabel(qu,v))}</span>`);
  }
  const meanPos = n ? ((st.mean-qu.min)/(qu.max-qu.min))*100 : 0;
  const cell = `calc((100% - ${(pts-1)*8}px)/${pts})`;
  const meanLeft = n? `calc(${cell} * (${(st.mean-qu.min)} + 0.5) + ${8*(st.mean-qu.min)}px)` : "50%";
  if(isOpt(qu)){
    const distinct = n? Object.values(st.counts).filter(c=>c>0).length : 0;
    const top = n? st.counts[st.mode] : 0;
    const modes = n? Object.keys(st.counts).filter(k=>st.counts[k]===top).map(k=>optLabel(qu,+k)) : [];
    const modeTxt = modes.length>1 ? "Tie: "+modes.join(" · ") : (modes[0]||"–");
    return `
  <div class="chart-head">
    <div class="hero"><span class="num">${n?top:"–"}</span><span class="den">/ ${n||"–"} ${n?"chose":""}</span></div>
    <div class="stat"><span class="v" style="font-size:17px;max-width:360px">${n?esc(modeTxt):"–"}</span><span class="l">most chosen</span></div>
    <div class="stat"><span class="v">${n?distinct:"–"}<small style="font-size:13px;color:var(--muted)"> / ${pts}</small></span><span class="l">options chosen</span></div>
  </div>
  ${n? `<div class="cols" style="grid-template-columns:repeat(${pts},minmax(0,1fr))">${cols.join("")}</div>
  <div class="axis" style="grid-template-columns:repeat(${pts},minmax(0,1fr))">${ticks.join("")}</div>`
      : `<div class="empty">No answers yet.</div><div class="axis" style="grid-template-columns:repeat(${pts},minmax(0,1fr))">${ticks.join("")}</div>`}
  <div class="strip">${strip.join("")}</div>`;
  }
  return `
  <div class="chart-head">
    <div class="hero"><span class="num">${n?fmt(st.mean):"–"}</span><span class="den">/ ${qu.max}</span></div>
    <div class="stat"><span class="v">${n}</span><span class="l">${n===1?"answer":"answers"}</span></div>
    <div class="stat"><span class="v">${n?fmt(st.median):"–"}</span><span class="l">median</span></div>
    <div class="stat"><span class="v">${n?"±"+fmt(st.sd):"–"}</span><span class="l">spread</span></div>
  </div>
  ${n? `<div class="cols" style="grid-template-columns:repeat(${pts},minmax(0,1fr))">${cols.join("")}</div>
  <div class="axis" style="grid-template-columns:repeat(${pts},minmax(0,1fr))">${ticks.join("")}</div>
  <div class="ends"><span>${esc(qu.lo)}</span><span>${esc(qu.hi)}</span></div>
  <div class="rail"><div data-label="mean ${fmt(st.mean)}" class="mean-mark ${(st.mean-qu.min)/(qu.max-qu.min)>0.78?"flip":""}" style="left:${meanLeft}"></div></div>`
      : `<div class="empty">No answers yet.</div><div class="ends"><span>${esc(qu.lo)}</span><span>${esc(qu.hi)}</span></div>`}
  <div class="strip">${strip.join("")}</div>`;
}
function sumScore(r){ if(!r.st.n) return -1; return isOpt(r.qu) ? r.st.counts[r.st.mode]/r.st.n : r.st.mean/r.qu.max; }
function sumMetric(r){ if(!r.st.n) return "–"; return isOpt(r.qu) ? `${r.st.counts[r.st.mode]}<small> /${r.st.n}</small>` : `${fmt(r.st.mean)}<small> /${r.qu.max}</small>`; }
function miniStrip(qu, vals){
  const pts=qu.max-qu.min+1, st=stats(vals,qu.min,qu.max); let s="";
  for(let v=qu.min,i=0;v<=qu.max;v++,i++){ const c=st.counts?.[v]||0; if(c) s+=`<i style="--c:${rampColor(i,pts)};flex:${c}"></i>`; }
  return `<div class="mini">${s}</div>`;
}

/* ============ export ============ */
function resultsPayload(){
  const cfg=S.cfg, ses=S.ses, rv=currentRoundVotes();
  const ids=Object.keys(rv).filter(k=>hasAnswers(rv[k])).sort((a,b)=>(rv[a].t||0)-(rv[b].t||0));
  return { pollId:POLL_ID, title:cfg.title, mode:cfg.mode, round:ses.round||1,
    exportedAt:new Date().toISOString(), respondents:ids.length,
    questions: cfg.questions.map((qu,i)=>{
      const vals=ids.map(k=>rv[k].answers[qu.id]).filter(v=>Number.isFinite(v));
      const st=stats(vals,qu.min,qu.max); const num=!isOpt(qu)&&st.n;
      return { n:i+1, id:qu.id, text:qu.text, kind:isOpt(qu)?"options":"scale",
        options:isOpt(qu)?[...qu.options]:null, min:qu.min, max:qu.max, lo:qu.lo||"", hi:qu.hi||"",
        answers:st.n||0, counts:st.counts||{}, mostChosen:st.n?optLabel(qu,st.mode):null,
        mean:num?+st.mean.toFixed(2):null, median:num?st.median:null, sd:num?+st.sd.toFixed(2):null }; }),
    answers: ids.map((k,i)=>({ respondent:"R"+String(i+1).padStart(2,"0"), at:new Date(rv[k].t||0).toISOString(),
      answers:Object.fromEntries(cfg.questions.map(qu=>[qu.id, Number.isFinite(rv[k].answers[qu.id])?rv[k].answers[qu.id]:null])) })) };
}
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
function download(name, text, type){ try{
  const url=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}catch(e){ alert("Saving failed: "+e.message); } }
function exportJSON(){ download(`tallyroom-${POLL_ID}-${stamp()}.json`, JSON.stringify(resultsPayload(),null,2), "application/json"); }
function exportCSV(){ const p=resultsPayload(), qq=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows=[["respondent","question_nr","question","value","label"].join(",")];
  p.answers.forEach(r=>p.questions.forEach(q=>{ const v=r.answers[q.id]; if(!Number.isFinite(v)) return;
    rows.push([qq(r.respondent), q.n, qq(q.text), v, qq(q.options?(q.options[v-1]||v):v)].join(",")); }));
  download(`tallyroom-${POLL_ID}-${stamp()}.csv`, "\ufeff"+rows.join("\r\n"), "text/csv;charset=utf-8"); }
function exportBtns(){ return Object.values(currentRoundVotes()).some(hasAnswers)
  ? `<button class="btn ghost" data-act="expJSON">Save results (JSON)</button><button class="btn ghost" data-act="expCSV">CSV</button>` : ""; }

function importResults(text, fname){
  let p=null; try{ p=JSON.parse(text); }catch(e){ alert("That file is not valid JSON."); return; }
  if(!p || !Array.isArray(p.questions) || !p.questions.length){ alert("No questions found in that file. Load a JSON saved by Tally Room."); return; }
  const qs=p.questions.map((q,i)=>{ const o=normOptions(q.options), id=String(q.id||("q"+i)), text=String(q.text||("Question "+(i+1)));
    return o.length>=2 ? {id, text, kind:"options", options:o, min:1, max:o.length, lo:"", hi:""}
                       : {id, text, min:clamp(Math.round(+q.min||1),0,10), max:clamp(Math.round(+q.max||5),1,11), lo:q.lo||"", hi:q.hi||""}; });
  const votes={};
  (Array.isArray(p.answers)?p.answers:[]).forEach((r,i)=>{ const a={};
    qs.forEach(qu=>{ const v=r && r.answers ? r.answers[qu.id] : null; if(Number.isFinite(v)) a[qu.id]=v; });
    if(Object.keys(a).length) votes[String((r&&r.respondent)||("R"+(i+1)))]={round:1, answers:a, t:Date.parse((r&&r.at)||"")||Date.now()}; });
  if(!Object.keys(votes).length && !confirm("That file has questions but no answers. Open it anyway?")) return;
  S.review={ live:{cfg:S.cfg, ses:S.ses, votes:S.votes},
    info:{ title:String(p.title||"Saved results"), n:Object.keys(votes).length, file:String(fname||""),
           exportedAt:String(p.exportedAt||"").slice(0,16).replace("T"," ") } };
  S.cfg={ title:String(p.title||"Saved results"), mode:p.mode==="batch"?"batch":"live", joinUrl:(S.review.live.cfg&&S.review.live.cfg.joinUrl)||"", questions:qs };
  S.ses={ phase:"summary", current:0, revealed:qs.map(q=>q.id), round:1, showLive:true, resetAt:(S.review.live.ses&&S.review.live.ses.resetAt)||0 };
  S.votes=votes; S.ui.view=null; S.ui.configOpen=false; render();
}
function reviewBanner(){ if(!S.review) return "";
  const i=S.review.info;
  return `<div class="banner" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span style="flex:1;min-width:220px">Reviewing saved results: ${esc(i.title)} · ${i.n} ${i.n===1?"respondent":"respondents"}${i.exportedAt?` · saved ${esc(i.exportedAt)}`:""}. The live poll is untouched.</span>
    <button class="btn sm" data-act="reviewPublish">Publish to the room</button><button class="btn sm ghost" data-act="reviewExit">Exit review</button></div>`;
}

/* ============ live data helpers ============ */
function normConfig(v){ if(v && v.questions && !Array.isArray(v.questions)) v.questions=Object.values(v.questions);
  if(v && v.questions) v.questions.forEach(qu=>{ if(qu && qu.options && !Array.isArray(qu.options)) qu.options=Object.values(qu.options); }); return v; }
function normSession(v){ if(v && v.revealed && !Array.isArray(v.revealed)) v.revealed=Object.values(v.revealed); if(v && !v.revealed) v.revealed=[]; return v; }
function connPill(){ return S.ui.offline ? `<span class="pill warn" title="Trying to reconnect"><span class="dot"></span>Reconnecting…</span>` : ""; }

/* ============ rendering ============ */
function render(){
  if(!S.cfg||!S.ses){ app.innerHTML=`<div class="wrap"><div class="big-wait card"><div class="pulse"></div><div class="meta">Connecting…</div></div></div>`; return; }
  const host = S.me.isHost && S.ui.view!=="participant";
  app.innerHTML = host ? hostHTML() : participantHTML();
  if(host) afterHost();
  if(S.ui.configOpen) app.insertAdjacentHTML("beforeend", configHTML());
  if(S.ui.configOpen) app.querySelector("#modal")?.addEventListener("input", ()=>{ try{ readDraftFromDOM(); }catch(e){} }, {passive:true});
}
function topbar(rightHTML){
  const ph=S.ses.phase; const live = ph!=="lobby";
  return `<div class="topbar"><div class="brand"><span class="mark"><i></i></span>${esc(S.cfg.title)}</div>
    <div class="controls">${rightHTML||""}${connPill()}<span class="pill ${live?"live":""}"><span class="dot"></span>${S.cfg.mode==="live"?"One at a time":"All first, then reveal"}</span></div></div>`;
}

        <span class="spacer"></span><label class="meta" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="showLive" data-act="showLive" ${ses.showLive?"checked":""}> show answers as they come in</label></div>`;

/* ---- participant ---- */
function myVotes(){ const v=S.votes[S.me.id]; return (v && v.round===S.ses.round) ? v : {round:S.ses.round, answers:{}}; }
function scaleHTML(qu, chosen){
  const pts=qu.max-qu.min+1; let b="";
  if(isOpt(qu)){

  }
  for(let v=qu.min,i=0;v<=qu.max;v++,i++){ b+=`<button data-act="vote" data-q="${qu.id}" data-v="${v}" class="${chosen===v?"on":""}" style="--c:${rampColor(i,pts)};--sel-ink:${selInk(i,pts)}" aria-pressed="${chosen===v}">${v}</button>`; }
  const cols = pts>6 ? Math.ceil(pts/2) : pts;
  return `<div class="scale" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${b}</div><div class="scale-ends"><span>${esc(qu.lo)}</span><span>${esc(qu.hi)}</span></div>`;

      ${done===Q.length?`<div class="toast">✓ All ${Q.length} answered. Your answers are saved; you can still change them until the reveal starts.</div>`:`<div class="toast wait">${Q.length-done} to go. Answers save automatically.</div>`}`;
  } else if(ph==="results"){
    const qu=Q[ses.current];
    body=`<div class="card p-q"><div class="qnum">Question ${ses.current+1} of ${Q.length}</div><div class="qtext">${esc(qu.text)}</div></div><div class="card chart">${chartHTML(qu,answersFor(qu.id))}</div>${Number.isFinite(mine.answers[qu.id])?`<div class="toast wait">You answered ${esc(optLabel(qu,mine.answers[qu.id]))}.</div>`:""}`;
  } else if(ph==="summary"){
    const rows=Q.map((qu,i)=>({qu,i,st:stats(answersFor(qu.id),qu.min,qu.max)})).sort((a,b)=>sumScore(b)-sumScore(a));
    body=`<div class="card" style="padding:20px"><div class="eyebrow">Summary</div>${rows.map(r=>`<div class="sum-row"><div class="t">${esc(r.qu.text)}<small>Q${r.i+1} · ${r.st.n} answers${isOpt(r.qu)&&r.st.n?` · most chosen: ${esc(optLabel(r.qu,r.st.mode))}`:""}</small></div>${miniStrip(r.qu,answersFor(r.qu.id))}<div class="m">${sumMetric(r)}</div></div>`).join("")}</div>`;
  }
  return `<div class="p-wrap"><div class="topbar"><div class="brand"><span class="mark"><i></i></span>${esc(cfg.title)}</div>${connPill()}${back}</div>${ro}${body}</div>`;
}

/* ---- config ---- */
function configHTML(){
  const d=S.ui.draft;
  return `<div class="modal" id="modal"><div class="card" role="dialog" aria-label="Edit questions">
    <div style="display:flex;align-items:center;gap:10px"><h2 style="font-size:22px;flex:1">Questions and settings</h2><button class="btn sm ghost" data-act="cfgClose">Close</button></div>
    <div class="field"><label for="cfgTitle">Title</label><input type="text" id="cfgTitle" data-cfg="title" value="${esc(d.title)}"></div>
    <div class="field"><label>Mode</label><div class="seg"><button data-act="cfgMode" data-v="live" class="${d.mode==="live"?"on":""}">One question at a time</button><button data-act="cfgMode" data-v="batch" class="${d.mode==="batch"?"on":""}">Answer all first, then reveal</button></div></div>
    <div class="field"><label for="cfgJoin">Join link shown to participants (leave empty to use this page's address)</label><input type="url" id="cfgJoin" data-cfg="joinUrl" value="${esc(d.joinUrl||"")}" placeholder="https://…"></div>
    <div style="display:grid;gap:12px">${d.questions.map((qu,i)=>`<div class="qcard" data-i="${i}">
      <div class="head"><span class="qnum">Question ${i+1}</span><button class="btn sm ghost" data-act="qUp" data-i="${i}" ${i===0?"disabled":""} title="Move up">↑</button><button class="btn sm ghost" data-act="qDown" data-i="${i}" ${i===d.questions.length-1?"disabled":""} title="Move down">↓</button><button class="btn sm danger" data-act="qDel" data-i="${i}">Remove</button></div>
      <textarea data-q="${i}" data-k="text" id="qt${i}" placeholder="Statement or question">${esc(qu.text)}</textarea>
      <div class="field"><label for="qopt${i}">Named options, one per line (leave empty for a numeric scale)</label><textarea data-q="${i}" data-k="options" id="qopt${i}" rows="${isOpt(qu)?Math.min(qu.options.length+1,8):2}" placeholder="Option A&#10;Option B&#10;Option C">${esc(isOpt(qu)?qu.options.join("\n"):"")}</textarea></div>
      <div class="row" style="${isOpt(qu)?"display:none":""}"><div class="field"><label for="qmin${i}">Scale from</label><input type="number" id="qmin${i}" data-q="${i}" data-k="min" value="${qu.min}" min="0" max="10"></div><div class="field"><label for="qmax${i}">to</label><input type="number" id="qmax${i}" data-q="${i}" data-k="max" value="${qu.max}" min="2" max="11"></div>
      <div class="field"><label for="qlo${i}">Low end label</label><input type="text" id="qlo${i}" data-q="${i}" data-k="lo" value="${esc(qu.lo)}"></div><div class="field"><label for="qhi${i}">High end label</label><input type="text" id="qhi${i}" data-q="${i}" data-k="hi" value="${esc(qu.hi)}"></div></div></div>`).join("")}</div>
    <div class="controls"><button class="btn" data-act="qAdd">+ Add question</button><button class="btn ghost" data-act="qAdd5">+ Add five (1–5, agree scale)</button></div>
    <details id="cfgJsonBox" ${S.ui.jsonOpen?"open":""}><summary>Import / export as JSON</summary><div class="field" style="margin-top:10px"><textarea id="cfgJson" rows="8" style="font-family:ui-monospace,monospace;font-size:13px">${esc(S.ui.jsonText ?? JSON.stringify(d.questions.map(exportQ),null,1))}</textarea><div class="meta">Numeric: {"text","min","max","lo","hi"}. Named options: {"text","options":["…","…"]}.</div><div class="controls"><button class="btn sm" data-act="cfgImport">Replace questions with this JSON</button></div></div></details>
    <div class="meta">Changing a question's scale after people answered keeps their answers; removing a question drops its answers.</div>
    <div class="controls"><button class="btn primary" data-act="cfgSave">Save</button><button class="btn ghost" data-act="cfgClose">Cancel</button></div>
  </div></div>`;
}
function readDraftFromDOM(){
  const d=S.ui.draft; const jb=document.getElementById("cfgJsonBox"); if(jb) S.ui.jsonOpen=jb.open; const jt=document.getElementById("cfgJson"); if(jt && jb && jb.open) S.ui.jsonText=jt.value; const t=document.getElementById("cfgTitle"); if(t) d.title=t.value.trim()||"Untitled";
  const j=document.getElementById("cfgJoin"); if(j) d.joinUrl=j.value.trim();
  document.querySelectorAll("[data-q][data-k]").forEach(el=>{ const qu=d.questions[+el.dataset.q]; if(!qu) return; const k=el.dataset.k; if(k==="options"){ qu.options=normOptions(el.value); return; } qu[k] = (k==="min"||k==="max") ? +el.value : el.value; });
  d.questions.forEach(qu=>{ qu.text=(qu.text||"").trim()||"Untitled question";
    if(qu.options && qu.options.length>=2){ qu.kind="options"; qu.min=1; qu.max=qu.options.length; qu.lo=""; qu.hi=""; }
    else { delete qu.kind; delete qu.options; qu.min=clamp(Math.round(qu.min||1),0,10); qu.max=clamp(Math.round(qu.max||5),qu.min+1,11); } });
}

/* ============ actions ============ */
let writeChain=Promise.resolve();
function write(fn){ writeChain = writeChain.then(fn).catch(e=>{ console.warn("write failed",e); if(e&&e.code==="invalid_argument"){ S.ui.readonly=true; render(); } }); return writeChain; }
function setSession(patch){ const next={...S.ses,...patch}; S.ses=next; render(); if(S.review) return Promise.resolve(); return write(()=>S.backend.setSession(next)); }
function setConfig(next){ S.cfg=next; render(); if(S.review) return Promise.resolve(); return write(()=>S.backend.setConfig(next)); }

app.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, v=b.dataset.v, ses=S.ses, Q=S.cfg.questions;
  if(S.review && (act==="reset"||act==="hardReset"||act==="vote")){ alert("Not while you are reviewing saved results. Exit review first."); return; }
  switch(act){
    case "mode": setConfig({...S.cfg, mode:v}); break;
    case "start": setSession({phase:"voting", current:0, revealed:[], showLive:false}); break;
    case "startReveal": setSession({phase:"results", current:0, revealed:Q.map(q=>q.id)}); break;
    case "reveal": setSession({revealed:[...new Set([...ses.revealed, Q[ses.current].id])]}); break;
    case "next": { const c=Math.min(Q.length-1, ses.current+1); setSession({current:c, phase: ses.phase==="results"?"results":"voting"}); break; }
    case "prev": { const c=Math.max(0, ses.current-1); setSession({current:c}); break; }
    case "gotoResults": setSession({phase:"results", current:+v||0}); break;
    case "summary": setSession({phase:"summary"}); break;
    case "lobby": setSession({phase:"lobby", current:0}); break;
    case "showLive": setSession({showLive: b.checked}); break;
    case "impPick": document.getElementById("impFile")?.click(); break;
    case "reviewExit": if(S.review){ const l=S.review.live; S.review=null; S.cfg=l.cfg; S.ses=l.ses; S.votes=l.votes; render(); } break;
    case "reviewPublish": { if(!S.review) break;
      if(!confirm("Publish these results to the live poll? The questions and answers everyone sees are replaced.")) break;
      const cfg=S.cfg, next={...S.ses}, votes=S.votes; S.review=null;
      write(()=>S.backend.setConfig(cfg));
      if(S.backend.setAllVotes) write(()=>S.backend.setAllVotes(votes));
      write(()=>S.backend.setSession(next));
      render(); break; }
    case "expJSON": exportJSON(); break;
    case "expCSV": exportCSV(); break;
    case "hardReset": if(confirm("Reset the session? All answers are cleared, the round counter goes back to 1 and every device has to tap to rejoin.")){
      S.votes={};
      setSession({phase:"lobby", current:0, revealed:[], showLive:false, round:1, resetAt:Date.now()});
      write(()=>S.backend.clearVotes());
      setTimeout(()=>write(()=>S.backend.clearVotes()), 2500); // sweep answers that were already in flight
    } break;
    case "rejoin": S.me.ackReset=(S.ses.resetAt||0); render(); if(S.heartbeat) S.heartbeat(); break;
    case "reset": if(confirm("Clear all answers and start a new round?")){ const r=(ses.round||1)+1; setSession({phase:"lobby", current:0, revealed:[], round:r}); write(()=>S.backend.clearVotes()); } break;
    case "asParticipant": S.ui.view="participant"; render(); break;
    case "asHost": S.ui.view=null; render(); break;
    case "vote": {
      const qid=b.dataset.q, val=+b.dataset.v; const mine=myVotes(); const next={round:S.ses.round, answers:{...mine.answers,[qid]:val}, t:Date.now()};
      S.votes[S.me.id]=next; render(); write(()=>S.backend.setVotes(S.me.id,next)); break; }
    case "config": S.ui.draft=JSON.parse(JSON.stringify(S.cfg)); S.ui.configOpen=true; render(); break;
    case "cfgClose": S.ui.configOpen=false; S.ui.draft=null; S.ui.jsonText=null; S.ui.jsonOpen=false; render(); break;
    case "cfgMode": readDraftFromDOM(); S.ui.draft.mode=v; render(); break;
    case "qUp": case "qDown": { readDraftFromDOM(); const i=+b.dataset.i, j=act==="qUp"?i-1:i+1; const a=S.ui.draft.questions; [a[i],a[j]]=[a[j],a[i]]; render(); break; }
    case "qDel": readDraftFromDOM(); S.ui.draft.questions.splice(+b.dataset.i,1); render(); break;
    case "qAdd": readDraftFromDOM(); S.ui.draft.questions.push(q("",1,5,"Strongly disagree","Strongly agree")); render(); setTimeout(()=>document.getElementById("qt"+(S.ui.draft.questions.length-1))?.focus(),0); break;
    case "qAdd5": readDraftFromDOM(); for(let k=0;k<5;k++) S.ui.draft.questions.push(q("",1,5,"Strongly disagree","Strongly agree")); render(); break;
    case "cfgImport": { readDraftFromDOM(); try{ const arr=JSON.parse(document.getElementById("cfgJson").value); if(!Array.isArray(arr)) throw 0; S.ui.draft.questions=arr.map(x=>q(x.text||"",+x.min||1,+x.max||5,x.lo||"",x.hi||"",x.options)); S.ui.jsonText=null; render(); }catch(err){ alert("That JSON could not be read. Expected a list like [{\"text\":\"…\",\"min\":1,\"max\":5,\"lo\":\"…\",\"hi\":\"…\"}] or [{\"text\":\"…\",\"options\":[\"…\",\"…\"]}]"); } break; }
    case "cfgSave": { readDraftFromDOM(); const d=S.ui.draft; if(!d.questions.length){ alert("Add at least one question."); break; } S.ui.configOpen=false; S.ui.draft=null; S.ui.jsonText=null; S.ui.jsonOpen=false; const cur=Math.min(S.ses.current, d.questions.length-1); setConfig(d); if(cur!==S.ses.current) setSession({current:cur}); break; }
  }
});
app.addEventListener("change", e=>{ const inp=e.target; if(!inp || inp.id!=="impFile") return;
  const f=inp.files && inp.files[0]; inp.value="";
  if(!f) return; const r=new FileReader(); r.onerror=()=>alert("Could not read that file.");
  r.onload=()=>importResults(String(r.result||""), f.name); r.readAsText(f); });
app.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.ui.configOpen){ S.ui.configOpen=false; S.ui.jsonText=null; render(); } });
app.addEventListener("toggle", e=>{ if(e.target && e.target.id==="cfgJsonBox") S.ui.jsonOpen=e.target.open; }, true);
document.addEventListener("keydown", e=>{ if(!S.me.isHost||S.ui.configOpen||S.ui.view==="participant") return; if(e.target.matches("input,textarea")) return;
  if(e.key==="ArrowRight"){ document.querySelector('[data-act="next"]:not([disabled])')?.click(); }
  if(e.key==="ArrowLeft"){ document.querySelector('[data-act="prev"]:not([disabled])')?.click(); }
  if(e.key===" " ){ const r=document.querySelector('[data-act="reveal"]'); if(r){ e.preventDefault(); r.click(); } } });

/* ============ boot ============ */
async function boot(){
  render();
  const be = await makeBackend();
  S.backend=be; S.me.id=be.id; S.me.isHost=be.isHost; S.ui.readonly = be.canWrite===false;
  let gotCfg=false, gotSes=false;
  be.onConfig(c=>{ if(S.review){ if(c && Array.isArray(c.questions) && c.questions.length) S.review.live.cfg=c; return; } if(c && Array.isArray(c.questions) && c.questions.length){ S.cfg=c; } else if(!gotCfg){ S.cfg=JSON.parse(JSON.stringify(DEFAULT_CONFIG)); if(be.isHost) write(()=>be.setConfig(S.cfg)); } gotCfg=true; render(); });
  be.onSession(s=>{ noteReset(s); if(S.review){ if(s && s.phase) S.review.live.ses={...DEFAULT_SESSION,...s}; return; } if(s && s.phase){ S.ses={...DEFAULT_SESSION,...s}; } else if(!gotSes){ S.ses={...DEFAULT_SESSION}; if(be.isHost) write(()=>be.setSession(S.ses)); } gotSes=true; render(); });
  be.onVotes(v=>{ if(S.review){ S.review.live.votes=v||{}; return; } S.votes=v||{}; render(); });
  // announce presence so the host sees who joined (a vote doc with no answers)
  function heartbeat(){ if(!S.ses || be.canWrite===false || isKicked() || S.review) return; const isP = !be.isHost || S.ui.view==="participant"; if(!isP) return;
    const cur=S.votes[be.id]; const doc = (cur && cur.round===S.ses.round) ? {...cur, t:Date.now()} : {round:S.ses.round, answers:{}, t:Date.now()};
    S.votes[be.id]=doc; write(()=>be.setVotes(be.id,doc)); }
  S.heartbeat=heartbeat;
  setTimeout(heartbeat, 800);
  setInterval(heartbeat, 60000);
  if(be.isHost) setInterval(render, 30000);

  /* ---- staying in sync after the screen has been off ---- */
  let offTimer=null;
  function setOffline(off){ if(off===!!S.ui.offline) return; S.ui.offline=off; if(S.cfg&&S.ses) render(); }
  if(be.onConn) be.onConn(ok=>{ clearTimeout(offTimer); if(ok) setOffline(false); else offTimer=setTimeout(()=>setOffline(true), 6000); });
  function applyPull(d){ if(!d || S.review) return;
    const c=normConfig(d.config); if(c && c.questions && c.questions.length) S.cfg=c;
    const ss=normSession(d.session); noteReset(ss); if(ss && ss.phase) S.ses={...DEFAULT_SESSION,...ss};
    const mine=S.votes[S.me.id]; S.votes=d.votes||{}; if(mine && mine.round===S.ses.round) S.votes[S.me.id]=mine;
    render(); }
  let pulling=false, lastPull=0;
  async function pullNow(){ if(!be.pull || pulling) return; pulling=true; lastPull=Date.now();
    try{ applyPull(await be.pull()); }catch(e){} finally{ pulling=false; } }
  async function watchdog(){
    if(document.visibilityState!=="visible") return;
    const down = !!(be.isConnected && !be.isConnected());
    if(down && be.nudge) be.nudge();
    // while waiting in the lobby the socket may sit idle for a long time, so read over plain
    // HTTPS now and then as well: that is the window in which the start would be missed
    const waiting = S.ses && S.ses.phase==="lobby" && !(S.me.isHost && S.ui.view!=="participant");
    const stale = down ? ((be.downFor?be.downFor():9e9)>=6000 && Date.now()-lastPull>4000)
                       : (waiting && Date.now()-lastPull>20000);
    if(stale) pullNow();
  }
  function wake(){ heartbeat(); watchdog(); }
  setInterval(watchdog, 5000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") wake(); });
  window.addEventListener("pageshow", wake);
  window.addEventListener("focus", wake);
  window.addEventListener("online", wake);
}

/* ============ backends ============ */
async function makeBackend(){
  if(window.firebase && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){ return makeFirebaseBackend(); }
  console.warn("Firebase not configured: running in single-browser demo mode.");
  return makeDemoBackend();
}

/* Demo backend: no network, one browser, 8 simulated participants (for previewing the design) */
function makeDemoBackend(){
  const listeners={cfg:[],ses:[],votes:[]}; let cfg=null, ses=null; const votes={};
  const emit=(k,v)=>listeners[k].forEach(f=>f(v));
  const id=localId();
  const be={ id, isHost:true, canWrite:true,
    isConnected:()=>true, onConn:f=>f(true), downFor:()=>0, nudge:()=>{}, pull:null,
    onConfig:f=>{listeners.cfg.push(f); f(cfg);}, onSession:f=>{listeners.ses.push(f); f(ses);}, onVotes:f=>{listeners.votes.push(f); f({...votes});},
    setConfig:async c=>{cfg=c; emit("cfg",cfg);}, setSession:async s=>{ses=s; emit("ses",ses); simulate();}, setVotes:async(pid,v)=>{votes[pid]=v; emit("votes",{...votes});},
    setAllVotes:async v=>{ for(const k of Object.keys(votes)) delete votes[k]; Object.assign(votes, v||{}); emit("votes",{...votes}); },
    clearVotes:async()=>{ for(const k of Object.keys(votes)) delete votes[k]; emit("votes",{}); } };
  const names=["a","b","c","d","e","f","g","h"];
  function simulate(){ if(!ses||!cfg) return; if(ses.phase==="lobby"){ names.forEach((n,i)=>setTimeout(()=>{ if(!votes["demo_"+n]||votes["demo_"+n].round!==ses.round){ votes["demo_"+n]={round:ses.round,answers:{},t:Date.now()}; emit("votes",{...votes}); } }, 300*i)); return; }
    if(ses.phase==="voting"){ const qs = cfg.mode==="live" ? [cfg.questions[ses.current]] : cfg.questions; names.forEach((n,i)=>qs.forEach((qu,j)=>setTimeout(()=>{ const v=votes["demo_"+n]||{round:ses.round,answers:{}}; if(v.answers[qu.id]!=null) return; const bias=(j%3===0?0.75:j%3===1?0.55:0.4); const r=(Math.random()+Math.random()+Math.random())/3; const val=Math.round(qu.min+(qu.max-qu.min)*clamp(r*1.1+bias*0.5-0.3,0,1)); v.answers[qu.id]=val; v.round=ses.round; votes["demo_"+n]=v; emit("votes",{...votes}); }, 500+400*i+150*j))); } }
  return be;
}
/* Firebase Realtime Database backend (self-hosted version, open to anyone with the link) */
function makeFirebaseBackend(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const root = firebase.database().ref("polls/"+POLL_ID);
  const params = new URLSearchParams(location.search);
  let isHost=false;
  try{
    if(params.get("host")===HOST_KEY && HOST_KEY){ localStorage.setItem("tr_host_"+POLL_ID,"1"); }
    if(params.get("host")==="off"){ localStorage.removeItem("tr_host_"+POLL_ID); }
    isHost = localStorage.getItem("tr_host_"+POLL_ID)==="1";
  }catch(e){ isHost = params.get("host")===HOST_KEY; }
  /* a phone that was locked or backgrounded comes back with a dead socket: watch the link,
     force a reconnect, and fall back to plain HTTPS reads so a stalled socket never strands anyone */
  const db = firebase.database();
  const REST = String(FIREBASE_CONFIG.databaseURL).replace(/\/+$/,"") + "/polls/" + POLL_ID;
  let connected=false, downSince=Date.now(), lastNudge=0; const connFns=[];
  db.ref(".info/connected").on("value", s=>{ const now=s.val()===true; if(now===connected) return; connected=now; if(!now) downSince=Date.now(); connFns.forEach(f=>f(now)); });
  return { id: localId(), isHost, canWrite:true,
    isConnected: () => connected,
    onConn: f => { connFns.push(f); f(connected); },
    downFor: () => connected ? 0 : Date.now()-downSince,
    nudge: () => { const t=Date.now(); if(connected || t-downSince<8000 || t-lastNudge<10000) return; lastNudge=t; try{ db.goOffline(); db.goOnline(); }catch(e){} },
    pull: async () => { const r = await fetch(REST+".json?_="+Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error("rest "+r.status); return (await r.json())||{}; },
    onConfig: f => root.child("config").on("value", s=>f(normConfig(s.val()))),
    onSession: f => root.child("session").on("value", s=>f(normSession(s.val()))),
    onVotes: f => root.child("votes").on("value", s=>f(s.val()||{})),
    setConfig: c => root.child("config").set(c),
    setSession: s => root.child("session").set(s),
    setVotes: (pid,v) => root.child("votes/"+pid).set(v),
    setAllVotes: v => root.child("votes").set(v||{}),
    clearVotes: () => root.child("votes").remove()
  };
}


boot();
})();
</script>
